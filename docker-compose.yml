# ponytail: 所有服务复用同一份日志轮转，避免 json-file 不限额把磁盘撑满（本次磁盘满的根因之一）
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# ponytail: 核心服务统一 unless-stopped，避免宿主机重启后全部躺平导致 502（曾因只有 cloudflared 有 restart 策略而复发）
x-restart: &default-restart
  restart: unless-stopped

services:
  postgres:
    <<: *default-restart
    image: postgres:16
    ports: ["5432:5432"]
    logging: *default-logging
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

  kafka:
    <<: *default-restart
    image: confluentinc/cp-kafka:7.6.0
    ports: ["9092:9092"]
    logging: *default-logging
    # ponytail: 容器内存封顶 + JVM 堆上限双保险，避免在 3.6G 小机上 JVM 按宿主机内存默认吃满触发 OOM
    mem_limit: 1.2g
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: mkU4ER3RzSqqe0k1lPlBOQ
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 10

  debezium:
    <<: *default-restart
    image: debezium/server:2.6
    logging: *default-logging
    # ponytail: JVM 堆封顶，防止 CDC 连接器失控吃光内存
    mem_limit: 800m
    volumes:
      - "./debezium/conf:/debezium/conf:ro"
      - "debezium-data:/debezium/data"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m"
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: postgres
      DEBEZIUM_SOURCE_DATABASE_PORT: 5432
      DEBEZIUM_SOURCE_DATABASE_USER: ${POSTGRES_USER}
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DEBEZIUM_SOURCE_DATABASE_DBNAME: ${POSTGRES_DB}
      TZ: Asia/Shanghai

  eventguard-server:
    <<: *default-restart
    build: ./eventguard-server
    ports: ["8080:8080"]
    logging: *default-logging
    # ponytail: JVM 堆封顶，避免 java -jar 按宿主机内存默认分配
    mem_limit: 800m
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  eventguard-ai:
    <<: *default-restart
    build:
      context: ./eventguard-ai
      args:
        PIP_INDEX_URL: ${PIPE_INDEX_URL:-https://pypi.org/simple}
    logging: *default-logging
    # ports: ["8000:8000"]
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    depends_on:
      kafka: { condition: service_healthy }

  eventguard-ui:
    <<: *default-restart
    build:
      context: ./eventguard-ui
      # ponytail: 构建期注入前端 API Key；未设置时兜底 changeme，与本地后端默认一致，保证零配置可跑
      args:
        VITE_API_KEY: ${VITE_API_KEY:-changeme}
    # ponytail: 运行时 API Key 由 EG_API_KEY 经 environment 注入（可靠），nginx envsubst 写进 config.js
    environment:
      EG_API_KEY: ${EG_API_KEY}
      TZ: Asia/Shanghai
    # ponytail: 映射到宿主机 80，使 http://域名 默认端口即可直达 UI（无需 :3000）；
    # 若后续上 HTTPS，再叠加 443 映射并在容器内 nginx 启用 TLS。
    ports: ["80:80"]
    volumes:
      # ponytail: 预留 ACME webroot（若后续备案后用 DNS-01 给源站签发证书则复用）；
      # 当前 Cloudflare 代理走 Flexible，源站只用 80，证书由 Cloudflare 边缘提供。
      - "/var/www/letsencrypt:/var/www/letsencrypt"
    logging: *default-logging
    depends_on: [eventguard-server]

  # ponytail: Cloudflare Tunnel 出网代理，绕过未备案域名的 Host 拦截。
  # 服务器主动连 Cloudflare（非外部连入 Tencent IP），故永不带"未备案 Host"入站；
  # --url 指定隧道把流量转发到 docker 内部 eventguard-ui:80，浏览器→Cloudflare(有效证书)→隧道→源站，
  # WebSocket/TLS 由 Cloudflare 透明处理。TUNNEL_TOKEN 在 .env 中提供。
  cloudflared:
    <<: *default-restart
    image: cloudflare/cloudflared:latest
    command: tunnel run --token ${TUNNEL_TOKEN} --url http://eventguard-ui:80
    env_file: .env
    # ponytail: 隧道是长连接，断了要能自恢复；其余服务沿用默认 no-restart 策略，此处单独开。
    logging: *default-logging
    depends_on: [eventguard-ui]

  pumba:
    image: gaiaadm/pumba
    logging: *default-logging
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    command: --random --interval 60s kill --signal SIGTERM
    profiles: ["chaos"]

volumes:
  pgdata:
  debezium-data:
