# ponytail: 所有服务复用同一份日志轮转，避免 json-file 不限额把磁盘撑满（本次磁盘满的根因之一）
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# ponytail: 核心服务统一 unless-stopped，避免宿主机重启后全部躺平导致 502（曾因只有 cloudflared 有 restart 策略而复发）
x-restart: &default-restart
  restart: unless-stopped

services:
  postgres:
    <<: *default-restart
    image: postgres:16
    ports: ["5432:5432"]
    logging: *default-logging
    # ponytail: 防止 PG 在长时间运行后缓存膨胀吃掉整机内存（上次宕机根因之一）；1g 远高于当前占用(49M)，仅作兜底封顶
    mem_limit: 1g
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

  kafka:
    <<: *default-restart
    image: confluentinc/cp-kafka:7.6.0
    ports: ["9092:9092"]
    logging: *default-logging
    # ponytail: 容器内存封顶 + JVM 堆上限双保险，避免 JVM 按宿主机内存默认吃满触发 OOM（实测占用 410M，堆512m，1g 留足余量）
    mem_limit: 1g
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: mkU4ER3RzSqqe0k1lPlBOQ
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 10

  debezium:
    <<: *default-restart
    image: debezium/server:2.6
    logging: *default-logging
    # ponytail: JVM 堆封顶，防止 CDC 连接器失控吃光内存（实测占用 186M，堆256m，600m 留足余量）
    mem_limit: 600m
    healthcheck:
      # 探测 Debezium JVM 存活：/proc 扫描含 "debezium" 的进程 cmdline（纯 sh，不依赖镜像内 pgrep）。
      # JVM 崩溃（如 OOM）→ unhealthy → 配合 restart: unless-stopped 自动拉起，避免 CDC 静默停转无人知。
      test: ["CMD-SHELL", "for p in /proc/[0-9]*; do grep -q debezium \"$$p/cmdline\" 2>/dev/null && exit 0; done; exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - "./debezium/conf:/debezium/conf:ro"
      - "debezium-data:/debezium/data"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m"
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: postgres
      DEBEZIUM_SOURCE_DATABASE_PORT: 5432
      DEBEZIUM_SOURCE_DATABASE_USER: ${POSTGRES_USER}
      DEBEZIUM_SOURCE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DEBEZIUM_SOURCE_DATABASE_DBNAME: ${POSTGRES_DB}
      TZ: Asia/Shanghai

  eventguard-server:
    <<: *default-restart
    build: ./eventguard-server
    ports: ["8080:8080"]
    logging: *default-logging
    # P1-12 优雅停机：给 server 最多 35s 处理完在途请求（Spring graceful shutdown 30s）
    stop_grace_period: 35s
    # ponytail: JVM 堆封顶，避免 java -jar 按宿主机内存默认分配（实测占用 220M，堆512m，700m 留足余量）
    mem_limit: 700m
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
      EG_RATE_LIMIT_ENABLED: ${EG_RATE_LIMIT_ENABLED:-true}
      EG_PROJECTION_CONCURRENCY: ${EG_PROJECTION_CONCURRENCY:-3}
      EG_DLT_REPLAY_CRON: ${EG_DLT_REPLAY_CRON:-0 0/10 * * * *}
      EG_DLT_MAX_REPLAY_ATTEMPTS: ${EG_DLT_MAX_REPLAY_ATTEMPTS:-3}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  eventguard-ai:
    <<: *default-restart
    build:
      context: ./eventguard-ai
      args:
        PIP_INDEX_URL: ${PIPE_INDEX_URL:-https://pypi.org/simple}
    logging: *default-logging
    # ponytail: AI 服务兜底内存封顶（Python 进程可能随模型/缓存膨胀）；实测占用 98M，1g 留足余量不会误杀
    mem_limit: 1g
    # ponytail: 开发期在宿主跑 Vite dev server 时，需经 localhost:8000 代理到 AI 服务（与 server 的 8080 同理）
    ports: ["8000:8000"]
    stop_grace_period: 15s
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      # ponytail: 异常存储持久化到挂载卷，避免 AI 容器重启后历史异常根因分析 404（原默认内存）
      EG_ANOMALY_STORE_PATH: /data/anomalies.jsonl
      # ponytail: 运营周报持久化到挂载卷：同周期周报在缓存窗口内免重复调 LLM，且前端可查历史
      EG_WEEKLY_REPORT_STORE_PATH: /data/weekly_reports.jsonl
      # ponytail: Isolation Forest 模型指向挂载卷（随 ai-data 持久化）；重训后无需重建镜像即可生效
      EG_IF_MODEL_PATH: /data/models/isolation_forest.pkl
      EG_IF_SCALER_PATH: /data/models/scaler.pkl
    volumes:
      - "./ai-data:/data"
    depends_on:
      kafka: { condition: service_healthy }

  eventguard-ui:
    <<: *default-restart
    build:
      context: ./eventguard-ui
    # ponytail: 登录态改为前端 JWT（localStorage + Authorization 头），无需构建期/运行时注入密钥
    environment:
      TZ: Asia/Shanghai
    # ponytail: 映射到宿主机 80，使 http://域名 默认端口即可直达 UI（无需 :3000）；
    # 若后续上 HTTPS，再叠加 443 映射并在容器内 nginx 启用 TLS。
    ports: ["80:80"]
    volumes:
      # ponytail: 预留 ACME webroot（若后续备案后用 DNS-01 给源站签发证书则复用）；
      # 当前 Cloudflare 代理走 Flexible，源站只用 80，证书由 Cloudflare 边缘提供。
      - "/var/www/letsencrypt:/var/www/letsencrypt"
    logging: *default-logging
    # ponytail: nginx 仅发静态资源，实测占用 4M，256m 绰绰有余
    mem_limit: 256m
    depends_on: [eventguard-server]

  # ponytail: Cloudflare Tunnel 出网代理，绕过未备案域名的 Host 拦截。
  # 服务器主动连 Cloudflare（非外部连入 Tencent IP），故永不带"未备案 Host"入站；
  # 用本地 --config ingress 按 hostname 路由（见 ./cloudflared/config.yml）：
  #   eventguard.jrwdev.site→eventguard-ui，grafana/prometheus/alerts/kafka/db.jrwdev.site→各自服务。
  # --token 负责隧道身份认证，config 负责源站路由。新增面板只需在 config.yml 加一条 + 面板加 Public Hostname。
  # 注意：之前用 --url 单源模式会忽略 hostname；纯默认模式依赖面板 ingress 配置，本环境未配会 503，
  # 故改成本地 ingress 文件，cloudflared 自身按 Host 匹配，稳定可控。TUNNEL_TOKEN 在 .env 中提供。
  cloudflared:
    <<: *default-restart
    image: cloudflare/cloudflared:latest
    command: --config /etc/cloudflared/config.yml tunnel run
    env_file: .env
    # ponytail: 隧道是长连接，断了要能自恢复；其余服务沿用默认 no-restart 策略，此处单独开。
    logging: *default-logging
    volumes:
      - "./cloudflared/config.yml:/etc/cloudflared/config.yml:ro"
      - "./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro"
      - "./cloudflared/credentials.json:/root/.cloudflared/343ed7a5-adbf-4ad9-8978-a3d997d5e558.json:ro"
    # ponytail: 隧道长连接，实测占用 19M，256m 绰绰有余
    mem_limit: 256m
    depends_on: [eventguard-ui, grafana, prometheus, alertmanager, adminer]

  pumba:
    image: gaiaadm/pumba
    logging: *default-logging
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    command: --random --interval 60s kill --signal SIGTERM
    profiles: ["chaos"]

  # ===== 评测模块（bench）：docker compose --profile bench run --rm bench =====
  # 栈内直连 Kafka/Postgres/Prometheus/server/AI，产出 out/benchmark-report.{md,json,html}。
  # 混沌注入由宿主机 bash eventguard-benchmark/chaos_run.sh 完成（bench 容器无 docker.sock）。
  bench:
    build: { context: ./eventguard-benchmark }
    profiles: ["bench"]
    image: eventguard-eventguard-bench
    working_dir: /app
    environment:
      SERVER_BASE_URL: http://eventguard-server:8080
      AI_BASE_URL: http://eventguard-ai:8000
      KAFKA_BOOTSTRAP: kafka:9092
      PROMETHEUS_URL: http://prometheus:9090
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EG_MACHINE_API_KEY: ${EG_MACHINE_API_KEY}
      EG_JWT_SECRET: ${EG_JWT_SECRET}
      BENCH_ADMIN_USER: admin
      BENCH_ADMIN_PASSWORD: ${EG_ADMIN_PASSWORD:-admin123456}
      BENCH_OPERATOR_USER: operator
      BENCH_OPERATOR_PASSWORD: ${EG_OPERATOR_PASSWORD:-operator123456}
      BENCH_VIEWER_USER: viewer
      BENCH_VIEWER_PASSWORD: ${EG_VIEWER_PASSWORD:-viewer123456}
      BENCH_PASSWORD: ${BENCH_PASSWORD:-bench123456}
      EG_RATE_LIMIT_MAX: ${EG_RATE_LIMIT_MAX:-60}
      EG_RATE_LIMIT_ENABLED: ${EG_RATE_LIMIT_ENABLED:-true}
      EG_GATEWAY_MOCK_PAYMENT_DELAY_MS: ${EG_GATEWAY_MOCK_PAYMENT_DELAY_MS:-0}
      EG_SAGA_ENABLED: ${EG_SAGA_ENABLED:-true}
      BENCH_SUITES: ${BENCH_SUITES:-functional}
      BENCH_OUT: /out
      BENCH_LOAD_WARMUP_SECONDS: ${BENCH_LOAD_WARMUP_SECONDS:-10}
      BENCH_LOAD_RAMP_SECONDS: ${BENCH_LOAD_RAMP_SECONDS:-35}
      BENCH_LOAD_HOLD_SECONDS: ${BENCH_LOAD_HOLD_SECONDS:-30}
      BENCH_READ_YOUR_WRITE_TARGET: ${BENCH_READ_YOUR_WRITE_TARGET:-150}
      BENCH_READ_YOUR_WRITE_WORKERS: ${BENCH_READ_YOUR_WRITE_WORKERS:-8}
      BENCH_LOAD_MAX_CONCURRENCY: ${BENCH_LOAD_MAX_CONCURRENCY:-30}
      BENCH_READ_YOUR_WRITE_MIN_SUCCESS_RATE: ${BENCH_READ_YOUR_WRITE_MIN_SUCCESS_RATE:-0.65}
      BENCH_LOAD_P95_MAX_MS: ${BENCH_LOAD_P95_MAX_MS:-2500}
    volumes:
      - "./eventguard-benchmark/out:/out:rw"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      eventguard-server: { condition: service_started }
      eventguard-ai: { condition: service_started }
      prometheus: { condition: service_started }
    mem_limit: 512m
    logging: *default-logging

  # ===== P0-2 监控告警（Prometheus + Alertmanager + Grafana）=====
  # 抓取 eventguard-server:8080/actuator/prometheus；告警转 webhook（ALERT_WEBHOOK_URL）。
  # Grafana 默认账号 admin/admin（首次登录可改），数据源 http://prometheus:9090。
  prometheus:
    <<: *default-restart
    image: prom/prometheus:v2.53.0
    # ponytail: 仅映射供本地 SSH 隧道访问原始 UI；Grafana 仍经 3001 直连此服务
    ports: ["9090:9090"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.route-prefix=/prometheus"
      - "--web.external-url=/prometheus"
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "prometheus-data:/prometheus"
    mem_limit: 300m
    logging: *default-logging
    depends_on: [eventguard-server]

  # ===== P0-2 主机指标（node_exporter）：让 Prometheus 能采集宿主机内存/负载，支撑主机内存告警 =====
  # 仅挂只读 /proc /sys，禁用 filesystem 采集（内存告警只需 meminfo），开销极小，不影响业务容器。
  node-exporter:
    <<: *default-restart
    image: prom/node-exporter:v1.8.2
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--no-collector.filesystem"
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
    ports: ["9100:9100"]
    mem_limit: 100m
    logging: *default-logging

  alertmanager:
    <<: *default-restart
    image: prom/alertmanager:v0.27.0
    # ponytail: 仅映射供本地 SSH 隧道访问；生产不直接暴露
    ports: ["9093:9093"]
    # 注:Alertmanager(v0.27.0~v0.33.1)不支持 --config.expand-env(仅 Prometheus 支持)，
    # 故用 entrypoint sed 把 ALERT_WEBHOOK_URL / SMTP_* 注入 tmpl 生成运行时配置
    # （未设置回落默认中继地址；SMTP 默认 163，密码必须来自 .env 的 EG_SMTP_PASSWORD）
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://172.18.0.1:9102/webhook}
      SMTP_SMARTHOST: ${EG_SMTP_SMARTHOST:-smtp.163.com:465}
      SMTP_FROM: ${EG_SMTP_FROM:-19913823585@163.com}
      SMTP_USER: ${EG_SMTP_USER:-19913823585@163.com}
      SMTP_PASSWORD: ${EG_SMTP_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -e "s|\$${ALERT_WEBHOOK_URL}|$${ALERT_WEBHOOK_URL}|g" \
            -e "s|\$${SMTP_SMARTHOST}|$${SMTP_SMARTHOST}|g" \
            -e "s|\$${SMTP_FROM}|$${SMTP_FROM}|g" \
            -e "s|\$${SMTP_USER}|$${SMTP_USER}|g" \
            -e "s|\$${SMTP_PASSWORD}|$${SMTP_PASSWORD}|g" \
            /etc/alertmanager/tmpl/alertmanager.yml.tmpl > /etc/alertmanager/alertmanager.yml
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --web.route-prefix=/alerts
    volumes:
      - "./prometheus/alertmanager.yml.tmpl:/etc/alertmanager/tmpl/alertmanager.yml.tmpl:ro"
    mem_limit: 100m
    logging: *default-logging

  grafana:
    <<: *default-restart
    image: grafana/grafana:11.1.0
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # ponytail: 门户经 /grafana 子路径访问，故固定 ROOT_URL 子路径并开启 serve_from_sub_path，
      # 否则 Grafana 资源(js/css)相对路径错位导致页面白屏。
      GF_SERVER_ROOT_URL: "http://localhost:8890/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - "grafana-data:/var/lib/grafana"
      - "./prometheus/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro"
      - "./prometheus/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro"
      - "./prometheus/dashboards:/var/lib/grafana/dashboards:ro"
    mem_limit: 300m
    logging: *default-logging
    depends_on: [prometheus, postgres]

  # ===== P1-13 集中日志（Loki + promtail）=====
  # promtail 读各容器日志并转发 Loki；Grafana Explore 里选 Loki 数据源即可查日志。
  # 对 3.6G 小机是可选增强；内存紧张时可移除这两个服务。
  # ponytail: 日志聚合按需启动，平时不常驻；需要时 `docker compose --profile tools up -d loki promtail`。
  loki:
    <<: *default-restart
    profiles: ["tools"]
    image: grafana/loki:3.1.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - "./prometheus/loki-config.yml:/etc/loki/local-config.yaml:ro"
      - "loki-data:/loki"
    mem_limit: 200m
    logging: *default-logging

  promtail:
    <<: *default-restart
    profiles: ["tools"]
    image: grafana/promtail:3.1.0
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - "/var/log:/var/log:ro"
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./prometheus/promtail-config.yml:/etc/promtail/config.yml:ro"
    mem_limit: 100m
    logging: *default-logging
    depends_on: [loki]

  # ===== Kafka Web 控制台（kafka-ui）：浏览 topic / 消费组 / 消息 =====
  # ponytail: 运维调试面板，平时不常驻（3.6G 小机省内存）。profiles 让默认 up 不启动；
  # 需要时 `docker compose --profile tools up -d kafka-ui` 拉起。
  kafka-ui:
    <<: *default-restart
    profiles: ["tools"]
    image: provectuslabs/kafka-ui:latest
    ports: ["8082:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: eventguard
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      SERVER_SERVLET_CONTEXT_PATH: /kafka
      JAVA_OPTS: "-Xms64m -Xmx256m"
    mem_limit: 512m
    logging: *default-logging
    depends_on: [kafka]

  # ===== 数据库 Web 控制台（Adminer）：浏览 Postgres 表 / 执行 SQL =====
  adminer:
    <<: *default-restart
    image: adminer:latest
    ports: ["8083:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    mem_limit: 128m
    logging: *default-logging
    depends_on: [postgres]

  # ===== 单一入口门户网关（Caddy）：单端口 8888，首页聚合所有面板链接，并按子路径反代到各后端 =====
  # 经 SSH 端口转发(ssh -L 8888:localhost:8888)后，本机浏览器开 http://localhost:8888 即看门户与各面板。
  # 各面板走子路径(/grafana /prometheus /alerts /kafka /db)，对应服务已配子路径基线。本地 SSH 隧道可信，不加 Basic Auth。
  caddy:
    <<: *default-restart
    image: caddy:2-alpine
    ports: ["8890:8890"]
    volumes:
      - "./caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./caddy/portal:/var/www/portal:ro"
    mem_limit: 128m
    logging: *default-logging
    depends_on: [grafana, prometheus, alertmanager, adminer]

volumes:
  pgdata:
  debezium-data:
  prometheus-data:
  grafana-data:
  loki-data:
