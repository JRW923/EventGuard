name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Java 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Maven test（CI 有 Docker，Testcontainers 用例会真跑）
        run: mvn -B test

  ai:
    name: AI 服务测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r eventguard-ai/requirements.txt
      - name: Pytest
        working-directory: eventguard-ai
        run: python -m pytest -q

  ui:
    name: 前端测试与类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: eventguard-ui/package-lock.json
      - run: npm ci
        working-directory: eventguard-ui
      - run: npm test
        working-directory: eventguard-ui
      - run: npm run type-check
        working-directory: eventguard-ui
