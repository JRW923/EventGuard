# 后端热更新开发环境（仅开发者本地/调试使用，不影响生产配置 docker-compose.yml / Dockerfile）。
#
# 本文件不会被 `docker compose up` 自动合并，必须显式指定才生效：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d eventguard-server eventguard-ai
#
# 行为：
#   - 后端改代码即自动重新编译/重启，无需重建镜像；前端仍用 Vite dev server（见 scripts/）。
#   - 服务名、端口、网络、依赖、环境变量均继承自 docker-compose.yml（同服务名合并），
#     因此 Vite 的代理目标（eventguard-server:8080 / eventguard-ai:8000）与生产一致。
#   - 生产部署仍只跑 `docker compose up -d`，本文件对它无任何影响。
#
# 注意（内存）：dev 版 Java 跑两个 JVM（后台增量编译循环 + spring-boot:run，fork=false 同进程），
# 二者都继承 JAVA_TOOL_OPTIONS，故实际生效堆以 JAVA_TOOL_OPTIONS 的 -Xmx 为准（MAVEN_OPTS 同进程会被覆盖）。
# 默认已按下限制留 ~300m 余量防 OOM：
#   ponytail: 两个 JVM 各约 320m 堆 + maven/元数据/OS 开销，安全线上限约 1g。
#   升级路径：若仍 OOM，先上调 mem_limit 再同步上调 JAVA_TOOL_OPTIONS -Xmx，且保证
#   「两 JVM 堆之和 + ~200m」< mem_limit，否则 cgroup 会 OOM-kill。

services:
  # Java：用 Dockerfile.dev 构建薄开发镜像（仅换启动方式，不重新打应用），
  # 后台持续增量编译，spring-boot:run + devtools 在类路径变化后自动重启。
  eventguard-server:
    # ponytail: 必须用独立镜像名，否则 dev 构建会覆盖生产 `eventguard-eventguard-server:latest`
    # （其 CMD 是 mvn spring-boot:run，需源码挂载），生产 `docker compose up -d` 无 --build 时
    # 复用该镜像会因无 pom.xml 崩溃循环（曾致订单数据查不到）。
    image: eventguard-eventguard-server-dev
    build:
      context: ./eventguard-server
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./eventguard-server:/app
      - maven-cache:/root/.m2
    environment:
      # JAVA_TOOL_OPTIONS 对所有 JVM 生效，是 run 与编译循环实际生效的堆上限
      MAVEN_OPTS: "-Xmx384m"
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m"
    mem_limit: 1g

  # Python：用 Dockerfile.dev（复用已构建 AI 镜像，依赖已装），仅开 uvicorn --reload，
  # 挂载源码后文件变化即自动重启。
  eventguard-ai:
    image: eventguard-eventguard-ai-dev
    build:
      context: ./eventguard-ai
      dockerfile: Dockerfile.dev
    volumes:
      - ./eventguard-ai:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    mem_limit: 512m

volumes:
  maven-cache:
