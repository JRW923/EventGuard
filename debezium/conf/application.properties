# —— Source: PostgreSQL ——
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=eventguard
debezium.source.database.password=eventguard
debezium.source.database.dbname=eventguard
debezium.source.plugin.name=pgoutput
# ponytail: Debezium 2.6 必填，旧名 database.server.name 已废弃、不会被映射成 topic.prefix，缺失则连接器配置校验失败
debezium.source.topic.prefix=eventguard
debezium.source.table.include.list=public.domain_events
debezium.source.publication.name=dbz_publication
# ponytail: 显式指定 offset 存储文件，否则默认为空 → new File("") 解析成工作目录 /debezium（目录），FileOffsetBackingStore 当文件读报 "Is a directory" 启动崩溃
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat

# —— Transform: 去掉 Debezium 包装，输出纯净 payload；并把 topic 重写成固定的 domain-events ——
# ponytail: Debezium Server 无内置配置项把所有 record 路由到单个 topic（StreamNameMapper 默认用 record.destination()，即 server.schema.table）。
# 这里用 Kafka Connect 的 RegexRouter SMT 把任意 topic 重写成 domain-events，与消费者订阅名对齐。
debezium.transforms=unwrap,reroute
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.drop.tombstones=true
debezium.transforms.unwrap.delete.handling.mode=drop
debezium.transforms.unwrap.add.source.fields=op,ts_ms
debezium.transforms.reroute.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.reroute.regex=.*
debezium.transforms.reroute.replacement=domain-events

# —— Sink: Kafka ——
debezium.sink.type=kafka
debezium.sink.kafka.bootstrap.servers=kafka:9092
# ponytail: producer 级 bootstrap 双保险——Debezium 2.6 的 KafkaChangeConsumer 若未从顶层键读到 bootstrap.servers 会 fallback 到 producer.*；缺它则 KafkaProducer 因 bootstrap.servers=[] 启动崩溃
debezium.sink.kafka.producer.bootstrap.servers=kafka:9092
# ponytail: 必须显式指定序列化器，否则 KafkaProducer 因 key.serializer=null 启动即崩溃，CDC 永远不工作
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# 注意：debezium.sink.kafka.topic 在 Debezium Server 中不生效（无此配置项），topic 统一由上面 reroute SMT 重写为 domain-events

# 用 aggregate_id 作为 Kafka 消息 key（保证同订单事件有序到同分区）
debezium.sink.kafka.message.key.columns=public.domain_events.aggregate_id

# —— 传递 event_id 作为消息头（用于幂等消费） ——
debezium.sink.kafka.message.headers.include=true
