<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- EventGuard 架构图（M5.6，文本 SVG，不依赖图形工具）
       CQRS + 事件溯源：命令端写 PG 事件库 → Debezium CDC → Kafka → AI 检测 / 查询投影 → 前端 -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-end">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box   { fill:#f4f7fb; stroke:#3a6ea5; stroke-width:2; rx:8; }
      .boxai { fill:#fdf3f0; stroke:#c0504d; stroke-width:2; rx:8; }
      .boxtp { fill:#eef7ef; stroke:#4f8a51; stroke-width:2; rx:8; }
      .title { font-size:15px; font-weight:bold; fill:#222; }
      .tech  { font-size:11px; fill:#666; }
      .lbl   { font-size:12px; fill:#333; }
      .hdr   { font-size:13px; font-weight:bold; fill:#1f3d5c; }
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="660" fill="#ffffff"/>
  <text x="20" y="30" class="title">EventGuard 架构：CQRS + 事件溯源 + AI 异常检测</text>
  <text x="20" y="48" class="tech">PostgreSQL 16 · Debezium 2.6 · Kafka 7.6 (KRaft) · Spring Boot 3.3 · FastAPI · Vue 3</text>

  <!-- 连线（先画，置于框之下） -->
  <g stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="880" y1="114" x2="800" y2="114"/>            <!-- Vue -> Command -->
    <line x1="560" y1="114" x2="440" y2="114"/>            <!-- Command -> PG -->
    <line x1="310" y1="178" x2="310" y2="190"/>            <!-- PG -> Debezium -->
    <line x1="310" y1="250" x2="310" y2="330"/>            <!-- Debezium -> Kafka(domain) -->
    <line x1="460" y1="362" x2="558" y2="362"/>            <!-- Kafka(domain) -> AI -->
    <line x1="430" y1="392" x2="558" y2="498"/>            <!-- Kafka(domain) -> Query 投影 -->
    <line x1="700" y1="402" x2="462" y2="498"/>            <!-- AI -> Kafka(anomaly) -->
    <line x1="460" y1="532" x2="878" y2="532"/>            <!-- Kafka(anomaly) -> 网关 -->
    <line x1="840" y1="532" x2="878" y2="532"/>            <!-- Query -> 网关 -->
    <line x1="990" y1="500" x2="990" y2="178" marker-end="url(#arrow)"/> <!-- 网关 -> Vue -->
  </g>

  <!-- 框：命令端写入路径 -->
  <g>
    <rect class="box" x="880" y="82" width="220" height="64"/>
    <text x="990" y="110" text-anchor="middle" class="hdr">Vue 3 管理前端</text>
    <text x="990" y="130" text-anchor="middle" class="tech">localhost:3000</text>

    <rect class="box" x="560" y="82" width="240" height="64"/>
    <text x="680" y="108" text-anchor="middle" class="hdr">命令侧 (Spring Boot REST)</text>
    <text x="680" y="128" text-anchor="middle" class="tech">POST /orders · :8080 · 聚合根状态机</text>

    <rect class="box" x="180" y="82" width="260" height="64"/>
    <text x="310" y="108" text-anchor="middle" class="hdr">PostgreSQL · domain_events</text>
    <text x="310" y="128" text-anchor="middle" class="tech">PG 16 · 事件溯源写库 · 命名卷持久化</text>
  </g>

  <!-- 框：CDC / Kafka -->
  <g>
    <rect class="boxtp" x="180" y="190" width="260" height="60"/>
    <text x="310" y="216" text-anchor="middle" class="hdr">Debezium CDC</text>
    <text x="310" y="234" text-anchor="middle" class="tech">2.6 · 逻辑复制 · 表 public.domain_events</text>

    <rect class="boxtp" x="180" y="330" width="280" height="64"/>
    <text x="320" y="356" text-anchor="middle" class="hdr">Kafka · domain-events</text>
    <text x="320" y="376" text-anchor="middle" class="tech">7.6 KRaft · 事件总线</text>
  </g>

  <!-- 框：AI 检测 -->
  <g>
    <rect class="boxai" x="560" y="330" width="280" height="72"/>
    <text x="700" y="356" text-anchor="middle" class="hdr">AI 服务 (FastAPI)</text>
    <text x="700" y="374" text-anchor="middle" class="tech">规则引擎 + IsolationForest + HMM</text>
    <text x="700" y="392" text-anchor="middle" class="tech">:8000 · 消费 domain-events</text>

    <rect class="boxtp" x="180" y="500" width="280" height="64"/>
    <text x="320" y="526" text-anchor="middle" class="hdr">Kafka · anomaly-alerts</text>
    <text x="320" y="546" text-anchor="middle" class="tech">7.6 KRaft · 告警总线</text>
  </g>

  <!-- 框：查询侧 + 网关 -->
  <g>
    <rect class="box" x="560" y="500" width="280" height="64"/>
    <text x="700" y="526" text-anchor="middle" class="hdr">查询侧 · OrderView 投影</text>
    <text x="700" y="546" text-anchor="middle" class="tech">Spring Boot · 消费 domain-events 投影</text>

    <rect class="box" x="880" y="500" width="220" height="64"/>
    <text x="990" y="526" text-anchor="middle" class="hdr">查询 / WebSocket 网关</text>
    <text x="990" y="546" text-anchor="middle" class="tech">GET /orders · /ws/anomalies</text>
  </g>

  <!-- 连线标签 -->
  <g class="lbl">
    <text x="840" y="106" text-anchor="middle">REST 写命令</text>
    <text x="500" y="106" text-anchor="middle">EventStore.append</text>
    <text x="338" y="240" text-anchor="middle">逻辑复制</text>
    <text x="338" y="318" text-anchor="middle">Debezium CDC</text>
    <text x="508" y="354" text-anchor="middle">domain-events</text>
    <text x="478" y="452" text-anchor="middle">domain-events (投影)</text>
    <text x="560" y="452" text-anchor="middle">anomaly-alerts</text>
    <text x="670" y="524" text-anchor="middle">anomaly-alerts (WS 推送)</text>
    <text x="860" y="524" text-anchor="middle">order_view / REST</text>
    <text x="1010" y="350" text-anchor="middle">WebSocket / REST</text>
  </g>

  <!-- 降级说明（ponytail：混沌/韧性边界） -->
  <g class="tech">
    <text x="20" y="610">降级：PG 崩溃→卷持久化不丢事件；Kafka 暂停→命令端仍可写（写不依赖 Kafka）；AI 延迟→规则引擎本地兜底。</text>
    <text x="20" y="628">ponytail: LLM 根因为可选增强（无 Ollama 走兜底）；补偿为人工触发白名单动作，未接真实支付网关。</text>
  </g>
</svg>
