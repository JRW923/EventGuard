# Alertmanager 配置：把 Prometheus 告警转发到 webhook（默认企业微信，可改钉钉/Slack）。
# 注意：Alertmanager 不支持 --config.expand-env 环境变量展开（v0.27.0~v0.33.1 均无此 flag，
# 仅 Prometheus 有）。URL 直接写死。接入企业微信机器人时，
# 把下面的 url 换成你的 webhook 地址即可（也可挂载自定义配置覆盖此文件）。
route:
  receiver: "webhook"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "webhook"
    webhook_configs:
      # 转发到本机飞书中继(监听 eventguard 网桥网关 172.18.0.1:9102，再转成飞书格式外发)
      - url: "http://172.18.0.1:9102/webhook"
        send_resolved: true
