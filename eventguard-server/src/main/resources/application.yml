server:
  port: 8080

spring:
  application:
    name: eventguard-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventguard}
    username: ${DB_USER:eventguard}
    password: ${DB_PASSWORD:eventguard}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
    consumer:
      group-id: ${KAFKA_GROUP:debug-consumer}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # ponytail: 当前生产者为可信内部 Python 服务；若将来接外部 topic 有 Jackson 多态反序列化风险，应收紧为具体包名
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/migration/V1__init.sql
        - classpath:db/migration/V2__full_schema.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info

eventguard:
  read-your-writes:
    timeout-ms: 2000
    poll-interval-ms: 50
