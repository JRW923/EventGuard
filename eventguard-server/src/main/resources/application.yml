server:
  port: 8080
  # P1-12 优雅停机：收到 SIGTERM 后停止接收新请求，等待在途请求处理完再退出
  shutdown: graceful

spring:
  application:
    name: eventguard-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventguard}
    username: ${DB_USER:eventguard}
    password: ${DB_PASSWORD:eventguard}
    driver-class-name: org.postgresql.Driver
    # P1-10 显式 HikariCP 连接池参数：小内存机 800m 堆封顶，连接池过大只会空占内存；
    # 命令/查询池 8 + 投影池 2，保持总连接预算 10，优先保障 50 并发写入。
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:9092}
    consumer:
      group-id: ${KAFKA_GROUP:debug-consumer}
      auto-offset-reset: earliest
      # Debezium 用 StringSerializer 产出纯 JSON 字符串（无 Spring 的 __TypeId__ 头），故消费端必须用
      # StringDeserializer 原样接收，再交由 EventDeserializer 解析。用 JsonDeserializer 会因找不到目标类型
      # 抛 IllegalStateException，使整条投影链（Kafka -> order_view）静默断开，前端创建的订单永不出现在列表。
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/migration/V1__init.sql
        - classpath:db/migration/V2__full_schema.sql
        - classpath:db/migration/V3__auth.sql
        - classpath:db/migration/V4__gateway.sql
        - classpath:db/migration/V5__auth_token_version.sql
        - classpath:db/migration/V6__query_indexes.sql
        - classpath:db/migration/V7__command_log_request_hash.sql
        - classpath:db/migration/V8__anomaly_alerts.sql

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name:eventguard-server}

eventguard:
  projection-datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventguard}
    username: ${DB_USER:eventguard}
    password: ${DB_PASSWORD:eventguard}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
  read-your-writes:
    timeout-ms: 2000
    poll-interval-ms: 50
    max-poll-interval-ms: 200
