server {
    listen 80;
    server_name _;

    # gzip 压缩（P1-9）：压缩静态资源与 API 响应，明显减小前端 bundle 传输体积
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
    gzip_vary on;

    # 安全响应头（P1-9）：防点击劫持 / 禁止 MIME 嗅探 / 降级 referrer；HSTS 仅在 HTTPS 生效
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ponytail: 用 Docker 内嵌 DNS 在每次请求时重新解析后端域名，避免后端容器重建换 IP 后
    # nginx 仍缓存旧 IP 导致代理 404（曾导致 /orders 404、/ws 未连接）。valid 控制缓存时长。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $eg_server "eventguard-server:8080";
    set $eg_ai "eventguard-ai:8000";

    root /usr/share/nginx/html;
    index index.html;

    # ACME http-01 挑战：certbot 在宿主机把验证文件写到挂载目录，由此 location 提供
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # SPA history 模式回退
    # ponytail: index.html 未哈希，禁用缓存避免浏览器沿用旧 JS 引用；带哈希的 assets 可长期缓存
    # （location 级 add_header 覆盖 server 级，故安全头在此重复声明）
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket 实时告警（Java 服务，M3.8）
    location /ws {
        proxy_pass http://$eg_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
    }

    # 根因分析（Python AI 服务，M3.7）：/anomalies/{id}/analysis
    location /anomalies/ {
        proxy_pass http://$eg_ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # 自然语言查询（Python AI 服务，M4.2）：/ai/query
    location /ai/ {
        proxy_pass http://$eg_ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # 订单命令/查询、补偿执行（Java 服务）：/orders、/compensations
    location /orders {
        proxy_pass http://$eg_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /compensations {
        proxy_pass http://$eg_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    # 登录/用户/角色（Java 服务）：/auth、/users、/roles
    location /auth {
        proxy_pass http://$eg_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /users {
        proxy_pass http://$eg_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
    location /roles {
        proxy_pass http://$eg_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    # 网关回调（真实 Provider webhook，如支付宝）：透传 X-API-Key 机器密钥
    location /gateway/ {
        proxy_pass http://$eg_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-API-Key $http_x_api_key;
    }
}
